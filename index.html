<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="LulzForum — чёрно-белый bitmap форум-мессенджер: лента, чаты, теги, друзья, личное хранилище файлов и музыка со всего интернета." />
    <title>LulzForum — форум-мессенджер</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LulzForum" />
    <meta property="og:title" content="LulzForum — чёрно-белый bitmap форум-мессенджер" />
    <meta property="og:description" content="Лента рекомендаций, чаты, теги, друзья, личное хранилище файлов и музыка со всего интернета. 1-битный стиль, Supabase внутри." />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LulzForum" />
    <meta name="twitter:description" content="Чёрно-белый bitmap форум-мессенджер: лента, чаты, теги, музыка и файлы." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Тема применяется до первой отрисовки, чтобы не было вспышки.
      try {
        var savedTheme = localStorage.getItem('lulzforum:theme')
        if (savedTheme === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: var(--paper, #fff); color: var(--ink, #000); }
      :root { --ink: #000; --paper: #fff; }
      html[data-theme='dark'] { --ink: #fff; --paper: #000; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: var(--paper); color: var(--ink); z-index: 9999; font-family: ui-monospace, Menlo, monospace;
      }
      #boot .box { border: 2px solid var(--ink); padding: 18px 26px; text-align: center; }
      #boot b { display: block; font-size: 22px; letter-spacing: 4px; margin-bottom: 10px; }
      #boot i {
        display: block; width: 160px; height: 10px; border: 2px solid var(--ink);
        margin: 0 auto; background-image: repeating-linear-gradient(90deg, var(--ink) 0 8px, var(--paper) 8px 16px);
        background-size: 32px 100%; animation: bootmove .6s steps(4) infinite;
      }
      @keyframes bootmove { to { background-position: 32px 0; } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="box"><b>LULZFORUM</b><i></i></div></div>
    <div id="root"></div>
    <noscript>
      <div style="padding:24px;font-family:monospace;border:2px solid #000;margin:24px">
        LULZFORUM требует JavaScript. Включите его и перезагрузите страницу.
      </div>
    </noscript>
    <script>
      // Если приложение не запустилось, не держим загрузочный экран вечно.
      setTimeout(function () {
        var boot = document.getElementById('boot')
        if (boot) boot.remove()
      }, 6000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
